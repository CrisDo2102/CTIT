name: CI

on:
  push:
    branches: [main]
  pull_request:

# Quyền tối thiểu cho mã chạy trong CI: chỉ đọc repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kiểm tra kiểu (TypeScript)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test đơn vị (Vitest)
        run: npm test

      - name: Quét khóa bí mật trong mã nguồn
        run: npm run check:secrets

      - name: Build
        run: npm run build

      # Bản build thứ hai dùng dữ liệu mẫu (tests/fixtures) cho các bài E2E có dữ liệu (thư mục .next-fixtures).
      - name: Build bản dữ liệu mẫu
        run: npm run build:fixtures

      - name: Cài trình duyệt cho E2E
        run: npx playwright install --with-deps chromium

      # Hai nhóm bài: tests/e2e (không Sheet nào, trên .next) và tests/e2e-data (dữ liệu mẫu, trên .next-fixtures). Xem playwright.config.ts.
      - name: Test E2E (Playwright)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Lưu báo cáo E2E khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Chạy riêng để lỗ hổng thư viện mới công bố (không do code của mình) hiện ra thành một mục đỏ riêng, dễ phân biệt.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chỉ gói chạy thật trên máy chủ (không tính công cụ dev). Mức high trở lên làm CI đỏ.
      - name: Kiểm tra lỗ hổng trong thư viện
        run: npm audit --omit=dev --audit-level=high
